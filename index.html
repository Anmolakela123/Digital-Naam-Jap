<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1328">
<meta name="description" content="MantraMala — आधुनिक नाम जप, माला और ध्यान अनुभव">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon.svg">
<title>MantraMala — नाम जप • ध्यान • साधना</title>
<style>
:root{--bg:#f7efe1;--paper:#fffaf1;--paper2:#f3e3cf;--ink:#3b2118;--muted:#806e61;--accent:#a94d25;--accent2:#d9824f;--gold:#b98235;--line:rgba(91,53,34,.14);--shadow:0 18px 55px rgba(83,48,25,.13)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#fffdf8 0,#f7efe1 48%,#ead7bf 100%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans Devanagari",sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,560px);margin:auto;min-height:100vh;padding:15px 16px 32px;position:relative}.app:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background:radial-gradient(circle at 15% 15%,rgba(169,77,37,.12) 0 1px,transparent 2px),radial-gradient(circle at 85% 40%,rgba(185,130,53,.11) 0 1px,transparent 2px);background-size:28px 28px,34px 34px;mask-image:linear-gradient(to bottom,black,transparent 75%)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:3px 2px 16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850;letter-spacing:.1px}.brand-mark{width:42px;height:42px;border:1px solid rgba(169,77,37,.28);border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#fffaf0,#ead7bf);box-shadow:0 6px 18px rgba(83,48,25,.09)}.brand-mark svg{width:25px}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:650;margin-top:2px}.iconbtn{width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,241,.82);color:var(--ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(83,48,25,.07)}
.hero{position:relative;overflow:hidden;border:1px solid rgba(125,75,46,.15);border-radius:28px;padding:26px 22px 25px;background:linear-gradient(145deg,rgba(255,253,247,.97),rgba(244,226,204,.96));box-shadow:var(--shadow);text-align:center}.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 15%,rgba(185,130,53,.18),transparent 33%),linear-gradient(90deg,transparent 0 78%,rgba(169,77,37,.045) 78% 100%);pointer-events:none}.hero:after{content:"✦";position:absolute;right:17px;top:15px;color:rgba(169,77,37,.22);font-size:40px}.hero>*{position:relative}.om{font-size:48px;color:var(--accent);line-height:1;text-shadow:0 3px 15px rgba(169,77,37,.12)}h1{font-family:Georgia,"Times New Roman",serif;font-size:40px;margin:9px 0 2px;letter-spacing:.2px;color:#4b271c}.tag{color:var(--accent);font-size:13px;font-weight:750}.hero p{color:var(--muted);line-height:1.65;margin:14px auto 19px;max-width:400px}.primary{border:0;border-radius:15px;padding:13px 21px;color:#fffaf1;font-weight:850;background:linear-gradient(135deg,#b75d30,#963e20);box-shadow:0 10px 26px rgba(150,62,32,.2)}
.section-title{display:flex;align-items:end;justify-content:space-between;margin:27px 2px 12px}.section-title h2{margin:0;font-size:18px}.section-title span{font-size:11px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.deity{position:relative;overflow:hidden;min-height:236px;border:1px solid rgba(91,53,34,.13);border-radius:22px;background:#fff8ed;padding:0;text-align:left;color:var(--ink);box-shadow:0 12px 28px rgba(83,48,25,.11)}.deity img{width:100%;height:214px;display:block;object-fit:cover;object-position:center 28%;filter:saturate(1.02)}.deity:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(43,23,14,.83));pointer-events:none}.deity-info{position:absolute;left:14px;right:14px;bottom:11px;z-index:2;color:#fff}.deity-info b{font-size:17px}.deity-info small{display:block;color:#f5e8dc;margin-top:2px}.badge{display:inline-flex;margin-top:6px;padding:5px 8px;border-radius:999px;background:rgba(71,33,19,.5);border:1px solid rgba(255,255,255,.2);font-size:9px;color:#ffe6bf}.custom{margin-top:12px;padding:15px;border:1px dashed rgba(169,77,37,.35);border-radius:18px;background:rgba(169,77,37,.045)}.row{display:flex;gap:9px}.input{width:100%;border:1px solid var(--line);background:#fffaf2;color:var(--ink);border-radius:13px;padding:12px;outline:none}.input:focus{border-color:rgba(169,77,37,.55)}.custom button{white-space:nowrap}.hidden{display:none!important}
.screen{min-height:100vh}.jap-head{display:flex;align-items:center;gap:9px;padding:3px 0 12px}.jap-head .title{flex:1}.title b{font-size:16px}.title small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.back{font-size:22px}.mini-actions{display:flex;gap:8px}.mini-actions .iconbtn{width:38px;height:38px}.visual{position:relative;border-radius:26px;overflow:hidden;border:1px solid rgba(91,53,34,.14);height:310px;display:grid;place-items:center;background:#ead7bf;box-shadow:var(--shadow)}.visual .deity-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 27%;filter:saturate(1.03)}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(47,24,13,.02),rgba(47,24,13,.05) 48%,rgba(47,24,13,.72));}.deity-caption{position:absolute;z-index:2;left:18px;bottom:17px;text-align:left;color:#fff}.deity-caption b{font-family:Georgia,serif;font-size:29px;text-shadow:0 2px 10px #2b160d}.deity-caption small{display:block;color:#fff1df;margin-top:3px}
.mala-wrap{margin:15px 0 5px;border-radius:26px;padding:17px 9px 15px;background:linear-gradient(145deg,#fffaf1,#f0dfc9);border:1px solid rgba(91,53,34,.13);text-align:center;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(83,48,25,.09)}.mala-wrap:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(185,130,53,.12),transparent 45%);pointer-events:none}.mala{position:relative;width:min(330px,82vw);height:min(330px,82vw);margin:auto}.bead{position:absolute;width:17px;height:17px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#b7773a 0 12%,#70411e 30%,#3a1d10 72%,#1e0e08);box-shadow:0 2px 4px rgba(40,20,10,.55),inset 1px 1px 2px rgba(255,255,255,.22);transform:translate(-50%,-50%);transition:opacity .42s,filter .42s,transform .5s}.bead.used{opacity:0;filter:blur(9px);transform:translate(-50%,-50%) scale(1.9)}.bead.current{box-shadow:0 0 0 3px rgba(185,130,53,.14),0 0 22px rgba(185,130,53,.75),inset 1px 1px 2px rgba(255,255,255,.3)}.mala-center{position:absolute;inset:24% 24%;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#fff8eb,#f1dfc8 72%);border:1px solid rgba(169,77,37,.2);box-shadow:inset 0 0 38px rgba(185,130,53,.1),0 7px 25px rgba(83,48,25,.1)}.count{font-size:48px;font-weight:900;letter-spacing:-2px;color:#71351f}.count small{display:block;font-size:11px;letter-spacing:1px;color:var(--muted);font-weight:650}.mala-label{margin-top:-2px;color:#806e61;font-size:11px}.progress{height:5px;border-radius:99px;background:rgba(91,53,34,.1);margin:13px 12px 0;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9f4724,#d28a4d);transition:width .3s}.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.mode{border:1px solid var(--line);border-radius:16px;padding:13px 11px;background:rgba(255,250,241,.85);color:var(--ink)}.mode.active{border-color:rgba(169,77,37,.5);background:rgba(169,77,37,.08)}.mode b{display:block;font-size:13px}.mode small{color:var(--muted)}.tap{width:100%;border:0;border-radius:19px;padding:17px;background:linear-gradient(135deg,#b45a2d,#963d20);color:#fff8ef;font-size:18px;font-weight:900;box-shadow:0 14px 30px rgba(150,62,32,.2);touch-action:manipulation}.tap:active{transform:scale(.985)}.voice-status{margin-top:10px;padding:10px 13px;border:1px solid var(--line);border-radius:14px;background:rgba(255,250,241,.78);font-size:12px;color:var(--muted);text-align:center;min-height:40px}.voice-status.listening{color:#8c3d21;border-color:rgba(169,77,37,.35);box-shadow:0 0 22px rgba(169,77,37,.08)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}.stat{padding:11px 8px;border:1px solid var(--line);border-radius:15px;background:rgba(255,250,241,.72);text-align:center}.stat b{display:block;font-size:17px;color:#66301e}.stat small{color:var(--muted);font-size:10px}.result{margin-top:13px;border:1px solid rgba(169,77,37,.22);border-radius:21px;padding:17px;background:linear-gradient(145deg,rgba(169,77,37,.08),rgba(255,250,241,.72));text-align:center}.result h3{margin:0 0 8px;font-size:20px}.result p{margin:5px 0;color:#6e5c51;font-size:13px}.result strong{color:#9b4524}.dashboard{margin-top:23px;padding:17px;border:1px solid var(--line);border-radius:23px;background:rgba(255,250,241,.72)}.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.dash-card{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.35)}.dash-card b{font-size:20px;color:#69321f}.dash-card small{display:block;color:var(--muted);margin-top:3px}footer{padding:28px 4px 0;text-align:center;color:#8b796c;font-size:10px;line-height:1.6}@media(max-width:380px){.grid{gap:9px}.deity img{height:195px}.count{font-size:42px}.visual{height:280px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const DEITIES = {
  radha:{id:'radha',name:'श्री राधा',mantra:'राधा राधा',short:'राधे राधे',img:'assets/radha.jpg'},
  ram:{id:'ram',name:'श्री राम',mantra:'श्री राम',short:'राम राम',img:'assets/ram.jpg'},
  shiv:{id:'shiv',name:'महादेव',mantra:'ॐ नमः शिवाय',short:'शिव शिव',img:'assets/shiv.jpg'},
  krishna:{id:'krishna',name:'श्री कृष्ण',mantra:'हरे कृष्ण',short:'कृष्ण कृष्ण',img:'assets/krishna.jpg'},
  hanuman:{id:'hanuman',name:'हनुमान जी',mantra:'जय हनुमान',short:'हनुमान हनुमान',img:'assets/hanuman.jpg'},
  ganesh:{id:'ganesh',name:'श्री गणेश',mantra:'ॐ गं गणपतये नमः',short:'गणेश गणेश',img:'assets/ganesh.jpg'}
};
const KEY='mantraMalaStateV2';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{total:0,today:0,sessions:0,lastDate:new Date().toDateString(),history:[]};
if(state.lastDate!==new Date().toDateString()){state.today=0;state.lastDate=new Date().toDateString();}
let session={deity:null,count:0,target:108,start:0,elapsed:0,voice:false,listening:false,recognizer:null,finalSeen:''};
let timer=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function omSvg(){return `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#e8b75a" opacity=".45"/><path d="M18 31c0-9 13-15 20-7 5 6 1 13-5 14-7 1-11-5-8-9 3-4 10-2 10 3 0 6-7 10-7 10" stroke="#ffd98a" stroke-width="3" stroke-linecap="round"/><path d="M37 18c6 1 9 6 9 12" stroke="#ffd98a" stroke-width="3" stroke-linecap="round"/></svg>`}

function home(){
  stopVoice();
  document.getElementById('app').innerHTML=`
  <div class="topbar"><div class="brand"><div class="brand-mark">${omSvg()}</div><div>MantraMala<small>नाम जप • ध्यान • साधना</small></div></div><button class="iconbtn" id="statsBtn" aria-label="साधना">⌁</button></div>
  <section class="hero"><div class="om">ॐ</div><h1>MantraMala</h1><div class="tag">Focus on devotion • माला रखे आपका हिसाब</div><p>अपने आराध्य का चयन करें। स्पर्श से या अपनी आवाज़ से जप करें — हर जप के साथ रुद्राक्ष का एक मनका प्रकाश में विलीन होता जाएगा।</p><button class="primary" id="startFirst">साधना शुरू करें&nbsp; →</button></section>
  <div class="section-title"><h2>अपने आराध्य का चयन करें</h2><span>6 आराध्य</span></div>
  <div class="grid">${Object.values(DEITIES).map(d=>`<button class="deity" data-id="${d.id}"><img src="${d.img}" alt="${esc(d.name)}"><div class="deity-info"><b>${esc(d.name)}</b><small>${esc(d.mantra)}</small><span class="badge">108 जप • Voice + Tap</span></div></button>`).join('')}</div>
  <div class="custom"><div style="font-size:13px;font-weight:800;margin-bottom:8px">अपना मंत्र</div><div class="row"><input class="input" id="customMantra" placeholder="जैसे — जय श्री राम"><button class="primary" id="customBtn">जप</button></div></div>
  <div class="dashboard"><div class="section-title" style="margin:0 0 10px"><h2>मेरी साधना</h2><span>इस डिवाइस पर सुरक्षित</span></div><div class="dash-grid"><div class="dash-card"><b>${state.today.toLocaleString('en-IN')}</b><small>आज के जप</small></div><div class="dash-card"><b>${state.total.toLocaleString('en-IN')}</b><small>कुल जप</small></div><div class="dash-card"><b>${Math.floor(state.today/108).toLocaleString('en-IN')}</b><small>आज की पूर्ण माला</small></div><div class="dash-card"><b>${state.sessions.toLocaleString('en-IN')}</b><small>साधना सत्र</small></div></div></div>
  <footer>MantraMala एक client-side devotional tool है। आपका जप डेटा इसी browser में रहता है। Voice सुविधा आपके browser की speech-recognition support पर निर्भर करती है।</footer>`;
  document.querySelectorAll('.deity').forEach(b=>b.onclick=()=>start(b.dataset.id));
  document.getElementById('customBtn').onclick=()=>{let v=document.getElementById('customMantra').value.trim();if(v)start('custom',v)};
  document.getElementById('startFirst').onclick=()=>start('radha');
  document.getElementById('statsBtn').onclick=()=>dashboard();
}
function dashboard(){
  const hist=state.history.slice(-8).reverse();
  document.getElementById('app').innerHTML=`<div class="topbar"><button class="iconbtn" id="back">←</button><div style="font-weight:800">मेरी साधना</div><div></div></div>
  <div class="dashboard" style="margin-top:0"><div class="dash-grid">
  <div class="dash-card"><b>${state.today.toLocaleString('en-IN')}</b><small>आज के जप</small></div>
  <div class="dash-card"><b>${state.total.toLocaleString('en-IN')}</b><small>कुल जप</small></div>
  <div class="dash-card"><b>${Math.floor(state.today/108).toLocaleString('en-IN')}</b><small>आज की माला</small></div>
  <div class="dash-card"><b>${state.sessions.toLocaleString('en-IN')}</b><small>सत्र</small></div></div></div>
  <div class="section-title"><h2>हाल की साधना</h2></div>
  <div>${hist.length?hist.map(h=>`<div class="stat" style="display:flex;justify-content:space-between;margin:8px 0;text-align:left"><div><b style="font-size:14px">${esc(h.name)}</b><small>${new Date(h.at).toLocaleString('hi-IN')}</small></div><strong>${h.count} जप</strong></div>`).join(''):`<div class="voice-status">अभी कोई सत्र पूरा नहीं हुआ।</div>`}</div>`;
  document.getElementById('back').onclick=home;
}
function start(id,customText){
  stopVoice();
  const d=id==='custom'?{id:'custom',name:'आपका मंत्र',mantra:customText,short:customText,img:null}:DEITIES[id];
  session={deity:d,count:0,target:108,start:Date.now(),elapsed:0,voice:false,listening:false,recognizer:null,finalSeen:''};
  renderJap();
}
function renderJap(){
  const d=session.deity;
  document.getElementById('app').innerHTML=`<div class="jap-head"><button class="iconbtn back" id="back">←</button><div class="title"><b>${esc(d.name)}</b><small>${esc(d.mantra)}</small></div><div class="mini-actions"><button class="iconbtn" id="reset">↻</button></div></div>
  ${d.img?`<div class="visual"><img class="deity-photo" src="${d.img}" alt="${esc(d.name)}"><div class="deity-caption"><b>${esc(d.name)}</b><small>${esc(d.mantra)}</small></div></div>`:`<div class="visual" style="min-height:190px;background:radial-gradient(circle at 50% 35%,rgba(232,183,90,.22),transparent 45%),#111827"><div class="deity-caption" style="position:relative;left:auto;bottom:auto;text-align:center"><b>${esc(d.name)}</b><small>${esc(d.mantra)}</small></div></div>`}
  <div class="mala-wrap"><div class="mala" id="mala"><div class="mala-center"><div class="count" id="count">0<small>जप</small></div></div></div><div class="mala-label"><span id="targetText">0 / 108</span> • रुद्राक्ष माला</div><div class="progress"><i id="prog"></i></div></div>
  <div class="mode-row"><button class="mode active" id="tapMode">👆 <b>स्पर्श से जप</b><small>हर टैप = 1 जप</small></button><button class="mode" id="voiceMode">🎙️ <b>बोलकर जप</b><small>मंत्र बोलें और count होगा</small></button></div>
  <button class="tap" id="tap">ॐ &nbsp; जप करें</button>
  <div class="voice-status" id="voiceStatus">बोलकर जप के लिए Voice Mode चुनें</div>
  <div class="stats"><div class="stat"><b id="elapsed">00:00</b><small>समय</small></div><div class="stat"><b id="rpm">0</b><small>जप / मिनट</small></div><div class="stat"><b id="malaCount">0</b><small>पूर्ण माला</small></div></div>
  <div id="result"></div>`;
  buildMala(); bindJap(); tick();
}
function buildMala(){
  const wrap=document.getElementById('mala'); 
  for(let i=0;i<108;i++){
    const a=(i/108)*Math.PI*2-Math.PI/2, r=46;
    const b=document.createElement('span');b.className='bead';b.dataset.i=i;
    b.style.left=(50+r*Math.cos(a))+'%';b.style.top=(50+r*Math.sin(a))+'%';
    wrap.appendChild(b);
  }
}
function bindJap(){
  document.getElementById('back').onclick=()=>{stopVoice();home()};
  document.getElementById('reset').onclick=()=>{stopVoice();start(session.deity.id,session.deity.mantra)};
  document.getElementById('tap').onclick=()=>increment(1,'tap');
  document.getElementById('tapMode').onclick=()=>setMode(false);
  document.getElementById('voiceMode').onclick=()=>setMode(true);
}
function setMode(v){
  session.voice=v;
  document.getElementById('tapMode').classList.toggle('active',!v);
  document.getElementById('voiceMode').classList.toggle('active',v);
  const tap=document.getElementById('tap');
  tap.style.display=v?'none':'block';
  if(v) startVoice(); else stopVoice();
}
function normalize(s){
 return s.toLowerCase().replace(/[।,.!?;:]/g,' ').replace(/\s+/g,' ').trim();
}
function mantraVariants(){
 const d=session.deity, arr=[d.mantra,d.short,d.name];
 if(d.id==='radha')arr.push('radha radha','राधा राधा','राधे राधे');
 if(d.id==='ram')arr.push('shri ram','jai shri ram','श्री राम','जय श्री राम','ram ram','राम राम');
 if(d.id==='shiv')arr.push('om namah shivay','om namah shivaya','ॐ नमः शिवाय','shiv shiv','शिव शिव');
 if(d.id==='krishna')arr.push('hare krishna','हरे कृष्ण','krishna krishna','कृष्ण कृष्ण');
 if(d.id==='hanuman')arr.push('jai hanuman','जय हनुमान','hanuman hanuman','हनुमान हनुमान');
 if(d.id==='ganesh')arr.push('om gam ganapataye namah','ॐ गं गणपतये नमः','ganesh ganesh','गणेश गणेश');
 return [...new Set(arr.map(normalize).filter(Boolean))].sort((a,b)=>b.length-a.length);
}
function countOccurrences(text){
 const n=normalize(text), vars=mantraVariants();
 let total=0, remaining=n;
 for(const v of vars){
   let pos=0;
   while((pos=remaining.indexOf(v,pos))>-1){total++;remaining=remaining.slice(0,pos)+' '.repeat(v.length)+remaining.slice(pos+v.length);pos+=v.length;}
 }
 // If user speaks only a deity name, each occurrence is a japa.
 if(total===0){
   const token=normalize(session.deity.name).split(' ')[0];
   if(token.length>2){const re=new RegExp(token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');total=(n.match(re)||[]).length}
 }
 return total;
}
function startVoice(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 const status=document.getElementById('voiceStatus');
 if(!Speech){status.textContent='इस browser में Voice Recognition उपलब्ध नहीं है। Chrome/Edge में Voice Mode आज़माएँ।';return}
 const r=new Speech();session.recognizer=r;r.lang='hi-IN';r.continuous=true;r.interimResults=false;r.maxAlternatives=1;
 r.onstart=()=>{session.listening=true;status.classList.add('listening');status.textContent='🎙️ सुन रहा हूँ… अपना मंत्र बोलें';};
 r.onresult=e=>{
   for(let i=e.resultIndex;i<e.results.length;i++){
     if(!e.results[i].isFinal)continue;
     const txt=e.results[i][0].transcript||'';
     if(txt===session.finalSeen)continue; session.finalSeen=txt;
     const n=countOccurrences(txt);
     if(n>0){increment(n,'voice');status.textContent=`सुना: “${txt}”  •  +${n} जप`;}
     else status.textContent=`सुना: “${txt}”  •  मंत्र नहीं मिला`;
   }
 };
 r.onerror=e=>{session.listening=false;status.classList.remove('listening');status.textContent='Voice error: '+(e.error||'microphone');};
 r.onend=()=>{session.listening=false;status.classList.remove('listening');if(session.voice&&session.count<session.target)setTimeout(()=>{try{r.start()}catch{}} ,250)};
 try{r.start()}catch{}
}
function stopVoice(){if(session.recognizer){try{session.recognizer.onend=null;session.recognizer.stop()}catch{}session.recognizer=null}}
function increment(n,source){
 if(session.count>=session.target)return;
 const old=session.count;session.count=Math.min(session.target,session.count+n);
 const diff=session.count-old;
 state.total+=diff;state.today+=diff;save();
 for(let i=old;i<session.count;i++){const b=document.querySelector(`.bead[data-i="${i}"]`);if(b){b.classList.add('used');setTimeout(()=>b.remove(),450)}}
 const current=document.querySelector(`.bead[data-i="${session.count}"]`);if(current)current.classList.add('current');
 updateUi();
 if(session.count>=session.target)complete();
}
function updateUi(){
 const c=session.count;document.getElementById('count').firstChild.textContent=c;
 document.getElementById('targetText').textContent=`${c} / ${session.target}`;
 document.getElementById('prog').style.width=(c/session.target*100)+'%';
 document.getElementById('malaCount').textContent=Math.floor(c/108);
 const mins=Math.max((Date.now()-session.start)/60000,1/60);document.getElementById('rpm').textContent=Math.round(c/mins);
}
function tick(){
 clearInterval(timer);timer=setInterval(()=>{if(!document.getElementById('elapsed'))return;const sec=Math.floor((Date.now()-session.start)/1000);document.getElementById('elapsed').textContent=new Date(sec*1000).toISOString().slice(14,19);updateUi()},500);
}
function complete(){
 stopVoice();session.elapsed=Math.floor((Date.now()-session.start)/1000);state.sessions++;state.history.push({name:session.deity.name,count:session.count,seconds:session.elapsed,at:new Date().toISOString()});if(state.history.length>40)state.history.shift();save();
 const rpm=Math.round(session.count/Math.max(session.elapsed/60,1/60));
 document.getElementById('result').innerHTML=`<div class="result"><h3>✨ एक माला पूर्ण</h3><p><strong>${session.count}</strong> जप पूरे हुए</p><p>समय: <strong>${formatTime(session.elapsed)}</strong> • गति: <strong>${rpm} जप/मिनट</strong></p><button class="primary" id="again" style="margin-top:10px">नई माला शुरू करें →</button></div>`;
 document.getElementById('again').onclick=()=>start(session.deity.id,session.deity.mantra);
 document.getElementById('tap').style.display='none';
}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')}
home();
</script>
